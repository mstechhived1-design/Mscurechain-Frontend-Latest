name: Build Android Mobile App (.apk)

on:
  workflow_dispatch: # Allows 1-click manual trigger from the GitHub Actions tab
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-android:
    name: Build MSCureChain Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Mobile App Repository
        uses: actions/checkout@v4
        with:
          repository: mstechhived1-design/mscurechian-app-
          ref: main

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pexpo.useLegacyPackaging=true --no-daemon

      - name: Rename APK for Distribution
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/MSCureChain-Patient-App.apk
          else
            cp $(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1) android/app/build/outputs/apk/release/MSCureChain-Patient-App.apk
          fi

      - name: Upload .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSCureChain-Android-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach Raw Patient App APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          files: android/app/build/outputs/apk/release/MSCureChain-Patient-App.apk
          name: 'MSCureChain Hospital Management System v1.0.3'
          body: 'Official MSCureChain Hospital System Installers for Windows Desktop and Android Devices.'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
