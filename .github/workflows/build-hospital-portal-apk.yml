name: Build MSCureChain Hospital Portal (.apk)

on:
  workflow_dispatch: # Allows 1-click manual trigger from GitHub Actions
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build-hospital-apk:
    name: Build MSCureChain Hospital Portal APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Hospital Portal Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK for Distribution
        run: |
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/MSCureChain-Hospital-Portal.apk
          else
            cp $(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1) android/app/build/outputs/apk/release/MSCureChain-Hospital-Portal.apk
          fi

      - name: Upload Hospital Portal .apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSCureChain-Hospital-Portal-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Attach Raw APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          files: android/app/build/outputs/apk/release/MSCureChain-Hospital-Portal.apk
          name: 'MSCureChain Hospital Management System v1.0.3'
          body: 'Official MSCureChain Hospital System Installers for Windows Desktop and Android Devices.'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

