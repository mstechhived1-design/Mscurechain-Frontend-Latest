name: Build Windows Desktop App (.exe)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions with a single click
  push:
    tags:
      - 'v*' # Trigger build only on version tags (e.g. v1.0.4)

jobs:
  build-windows:
    name: Build MSCureChain .exe
    runs-on: windows-latest

    permissions:
      contents: write # Needed to create GitHub Releases and upload .exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci --legacy-peer-deps

      - name: Configure Production Environment
        run: |
          echo "NEXT_PUBLIC_API_URL=/api/proxy" > .env
          echo "BACKEND_INTERNAL_URL=https://mscurechain-backend-latest-production.up.railway.app/api" >> .env
        shell: bash

      - name: Build Standalone Electron Application (.exe)
        run: npm run electron:build
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          NEXT_PUBLIC_API_URL: "/api/proxy"
          BACKEND_INTERNAL_URL: "https://mscurechain-backend-latest-production.up.railway.app/api"

      - name: Upload .exe Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MSCureChain-Windows-Setup
          path: dist-electron/*.exe
          if-no-files-found: error

      - name: Attach Raw Setup .exe to GitHub Release
        uses: softprops/action-gh-release@v2
        if: always()
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-electron/*.exe
          name: 'MSCureChain Hospital Management System ${{ github.ref_name }}'
          body: 'Official MSCureChain Hospital System Installers for Windows Desktop.'
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

