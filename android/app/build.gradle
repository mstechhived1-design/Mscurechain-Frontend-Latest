plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mscurechain.hospital'
    compileSdk 34

    defaultConfig {
        applicationId "com.mscurechain.hospital"
        minSdk 24
        targetSdk 34
        versionCode 6
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug // Uses default debug keystore for easy installation on any device
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core:1.12.0'
}

tasks.register('syncFrontendAssets') {
    doLast {
        def assetsDir = file("src/main/assets")
        def nextStatic = file("../../.next/static")
        def publicDir = file("../../public")
        def serverApp = file("../../.next/server/app")

        if (nextStatic.exists()) {
            println "[syncFrontendAssets] Bundling .next/static into Android assets..."
            copy {
                from nextStatic
                into "${assetsDir}/next_static"
            }
        }
        if (publicDir.exists()) {
            println "[syncFrontendAssets] Bundling public assets into Android assets..."
            copy {
                from publicDir
                into "${assetsDir}/public"
            }
        }
        if (serverApp.exists()) {
            println "[syncFrontendAssets] Bundling Next.js pre-rendered pages into Android assets..."
            copy {
                from serverApp
                into "${assetsDir}/pages"
            }
        }
    }
}
preBuild.dependsOn syncFrontendAssets


