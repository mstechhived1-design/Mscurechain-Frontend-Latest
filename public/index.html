<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MSCureChain - Hospital Management System</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      color: #0284c7;
      margin: 0 0 8px 0;
    }
    p {
      color: #64748b;
      font-size: 14px;
      margin: 0;
    }
  </style>
  <script>
    window.location.replace("https://www.mscurechain.com");
  </script>
</head>
<body>
  <div class="spinner"></div>
  <h1>MSCureChain</h1>
  <p>Connecting to Hospital Management System...</p>
</body>
</html>
